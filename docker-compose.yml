services:
  agent:
    build: .
    # RETO_KEY and LANGSMITH_TRACING are injected at runtime; never baked into the image
    env_file: .env
    volumes:
      # Cost log stays on the host: ./logs/costos.jsonl
      - ./logs:/app/logs
    # No restart policy yet: the script runs once, and a restart policy would
    # re-run it forever (burning credits). Enable only for the future long run:
    # restart: unless-stopped
