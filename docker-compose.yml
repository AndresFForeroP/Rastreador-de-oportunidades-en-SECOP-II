services:
  agent:
    build: .
    # RETO_KEY and LANGSMITH_TRACING are injected at runtime; never baked into the image
    env_file: .env
    volumes:
      # Logs and persistent run deliverables stay on the host
      - ./logs:/app/logs
      - ./data:/app/data
      - ./config:/app/config:ro
    # No restart policy for agent: the script runs once

  daemon:
    build: .
    command: ["pnpm", "daemon"]
    env_file: .env
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    volumes:
      # Logs, persistent state and task ledgers stay on the host
      - ./logs:/app/logs
      - ./data:/app/data
      - ./docs:/app/docs
      - ./config:/app/config:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
